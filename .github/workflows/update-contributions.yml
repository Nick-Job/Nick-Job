name: Refresh contributions graph

on:
  schedule:
    - cron: "17 22 * * 0"   # 每周日 22:17 UTC（北京时间周一 6:17）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate assets/contributions.svg
        run: python3 scripts/update-contributions.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh contributions graph"
            git push
          fi

name: Latest blog posts

on:
  schedule:
    - cron: "0 22 * * *"   # 每天 22:00 UTC（北京时间 6:00）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://nick-space-blog.vercel.app/rss.xml"
          max_post_count: 5
          readme_path: README.md
          date_format: "yyyy.mm.dd"
          template: |
            <div style="padding: 10px 0; border-bottom: 1px solid rgba(128,128,128,0.10); line-height: 1.5">
            <a href="$url" style="color: inherit; text-decoration: none; font-size: 14px; font-weight: 500">$title</a>
            <div style="color: #86868b; font-size: 12px; margin-top: 2px">$date</div>
            </div>

name: Latest blog posts

on:
  schedule:
    - cron: "0 22 * * *"   # 每天 22:00 UTC（北京时间 6:00）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://nick-space-blog.vercel.app/rss.xml"
          max_post_count: 5
          readme_path: README.md

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 196" width="880" height="196" role="img" aria-label="Focus: Design, Engineering, Storytelling">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#171233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="50%" stop-color="#bf5af2"/>
      <stop offset="100%" stop-color="#ff375f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="880" height="196" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="880" height="196" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <line x1="309" y1="44" x2="309" y2="152" stroke="#ffffff" stroke-opacity="0.07"/>
  <line x1="589" y1="44" x2="589" y2="152" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- Design -->
  <g transform="translate(56,40)">
    <path d="M13 0 L16.8 9.2 L26 13 L16.8 16.8 L13 26 L9.2 16.8 L0 13 L9.2 9.2 Z" fill="url(#accent)"/>
  </g>
  <text x="56" y="106" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Design</text>
  <text x="56" y="136" font-family="'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="13.5" fill="#93a1b5">视觉内容 · 排版</text>
  <text x="56" y="160" font-family="'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="13.5" fill="#93a1b5">公众号 · 小红书 · PPT</text>

  <!-- Engineering -->
  <g transform="translate(336,40)" stroke="url(#accent)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="9,5 2,13 9,21"/>
    <polyline points="17,5 24,13 17,21"/>
  </g>
  <text x="336" y="106" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Engineering</text>
  <text x="336" y="136" font-family="'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="13.5" fill="#93a1b5">AI 工具生态</text>
  <text x="336" y="160" font-family="'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="13.5" fill="#93a1b5">macOS 工具 · Skill 开发</text>

  <!-- Storytelling -->
  <g transform="translate(616,44)">
    <rect x="0" y="0" width="26" height="3.5" rx="1.75" fill="url(#accent)"/>
    <rect x="0" y="9" width="19" height="3.5" rx="1.75" fill="url(#accent)" opacity="0.65"/>
    <rect x="0" y="18" width="12" height="3.5" rx="1.75" fill="url(#accent)" opacity="0.35"/>
  </g>
  <text x="616" y="106" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Storytelling</text>
  <text x="616" y="136" font-family="'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="13.5" fill="#93a1b5">AI 工作流教程</text>
  <text x="616" y="160" font-family="'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="13.5" fill="#93a1b5">产品文档 · 经验分享</text>
